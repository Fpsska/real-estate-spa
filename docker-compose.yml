services:
    backend:
        build:
            context: .
            dockerfile: backend/Dockerfile
        container_name: real-estate-backend
        environment:
            NODE_ENV: production
            PORT: 8080
        ports:
            # host:container
            - '8080:8080'
        healthcheck:
            # GET the root endpoint and print the response body
            test: ['CMD', 'wget', '-qO-', 'http://localhost:8080/']
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s
        # auto-restart on crash, but not after a manual stop
        restart: unless-stopped

    frontend:
        build:
            context: .
            dockerfile: frontend/Dockerfile
        container_name: real-estate-frontend
        depends_on:
            backend:
                condition: service_healthy
        ports:
            # host:container
            - '3000:8080'
        restart: unless-stopped
